; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
monitor_speed = 115200
framework = arduino
board_build.partitions = default.csv
board_build.filesystem = littlefs
;includi fastLED e ESP32-HUB75-MatrixPanel-I2S-DMA.h
lib_deps =
  ;FastLED
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.14
  adafruit/Adafruit GFX Library@^1.12.4
  adafruit/RTClib@^2.1.4
  h2zero/NimBLE-Arduino@^1.4.3

  
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os
    ; NimBLE: 3 connessioni (2 giocatori + 1 di scorta), fino a 8 telefoni associati
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -DCONFIG_BT_NIMBLE_MAX_BONDS=8
    ; FastLED ottimizzazioni - disabilita features non usate
    -DFASTLED_INTERNAL=1
    -DFASTLED_ESP32_I2S=1
    ; Disabilita features pesanti di FastLED
    -DFASTLED_NO_MINIMUM_WAIT=1
    ; Ottimizzazioni dimensione
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections